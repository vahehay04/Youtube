name: Publish approved

on:
  schedule:
    # Запасная проверка кнопок (основная — «Wait for approval», запускается
    # сразу после отправки ролика). GitHub иногда пропускает эти запуски.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Process approvals and upload
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m agent.poll

      - name: Save state
        if: always()
        run: |
          git config user.name "shorts-agent"
          git config user.email "shorts-agent@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "state: approvals processed"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
