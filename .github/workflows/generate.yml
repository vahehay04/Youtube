name: Make new Short

on:
  schedule:
    # 08:47 и 16:47 по Москве (время в cron — UTC)
    - cron: "47 5 * * *"
    - cron: "47 13 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Сколько роликов сделать"
        default: "1"

permissions:
  contents: write

concurrency:
  group: state
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Generate and send for approval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m agent.generate --count "${{ github.event.inputs.count || '1' }}"

      - name: Save state
        if: always()
        run: |
          git config user.name "shorts-agent"
          git config user.email "shorts-agent@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "state: new video for approval"
          git pull --rebase -q && git push -q || true
