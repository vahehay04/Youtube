name: Make new Short

on:
  schedule:
    # 08:47 и 16:47 по Москве (время в cron — UTC).
    # Чтобы поставить на паузу, добавьте "# " в начале этих трёх строк.
    - cron: "47 5 * * *"
    - cron: "47 13 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "Сколько роликов сделать"
        default: "1"

permissions:
  contents: write
  actions: write

concurrency:
  group: state
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core

      - run: pip install -r requirements.txt

      - name: Publish approved videos first
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m agent.poll

      - name: Generate and send for approval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m agent.generate --count "${{ github.event.inputs.count || '1' }}"

      - name: Start waiting for the approval button
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run listen.yml --ref "${{ github.ref_name }}"

      - name: Save state
        if: always()
        run: |
          git config user.name "shorts-agent"
          git config user.email "shorts-agent@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "state: new video for approval"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
